spring.application.name=be

# 정적 파일(HTML/CSS/JS)과 API 응답 압축. Caddy 의 encode 를 대체한다.
server.compression.enabled=true
# .js 는 text/javascript 로 서빙된다(최신 표준). application/javascript 만 적으면 압축이 안 걸린다.
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# ── 데이터소스 ──
# 기본값은 로컬 도커 MySQL(`docker compose up -d db`).
# 운영은 HeatWave 이므로 DB_URL 에 sslMode=REQUIRED 를 포함해 주입한다.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sicksick}
spring.datasource.username=${DB_USER:sicksick}
spring.datasource.password=${DB_PASSWORD:sicksick}

# 스키마의 유일한 소유자는 Flyway 다. Hibernate 는 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate
# 뷰 렌더링 중 지연로딩을 막는다(커넥션 점유 시간이 요청 전체로 늘어나는 것을 방지).
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ── 인증 ──
# HS256 이라 32바이트 이상이어야 한다. 운영은 JWT_SECRET 환경변수 필수.
sicksick.auth.jwt-secret=${JWT_SECRET:local-dev-secret-please-override-me-0123456789}
sicksick.auth.access-token-ttl=30m
# 리프레시는 회전할 때마다 만료가 갱신된다(슬라이딩). 앱 웹뷰는 더 길게 잡는다.
sicksick.auth.refresh-token-ttl-web=14d
sicksick.auth.refresh-token-ttl-app=90d
# 슬라이딩만 있으면 토큰 체인이 무한히 이어진다. 최초 발급 후 이 기간이 지나면 재로그인.
sicksick.auth.refresh-token-absolute-ttl=365d
# 로컬 기본값이 false 인 이유: Safari 는 http://localhost 에서 Secure 쿠키를 거부한다.
sicksick.auth.cookie-secure=${COOKIE_SECURE:false}

# ── 가입 ──
# 휴대폰 인증번호를 이 값으로 고정한다. 비우면 매번 난수로 발급한다.
# 실제 SMS 발송을 붙이기 전까지 쓰는 임시값이며 운영에도 동일하게 적용된다.
# 이 값이 있는 동안에는 본인인증이 아무것도 검증하지 못한다(누구나 통과 가능).
# SMS 연동 후 SIGNUP_FIXED_CODE 를 빈 값으로 주면 난수 발급으로 돌아간다.
sicksick.signup.fixed-verification-code=${SIGNUP_FIXED_CODE:123456}

# ── OAuth ──
# 브라우저가 보는 주소. redirect_uri 를 이 값으로 조립하므로 각 사 콘솔 등록값과
# 문자 단위로 같아야 한다. 개발은 Vite(5173), 운영은 실제 도메인.
sicksick.oauth.base-url=${OAUTH_BASE_URL:http://localhost:5173}
sicksick.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
sicksick.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
sicksick.oauth.naver.client-id=${NAVER_CLIENT_ID:}
sicksick.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
# 앱 키 없이 로그인 전 구간을 돌려보기 위한 개발 전용 스텁.
# 운영(prod 프로파일)에서 true 면 기동을 실패시킨다.
sicksick.oauth.stub-enabled=${OAUTH_STUB:true}
