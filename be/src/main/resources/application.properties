spring.application.name=be

# 정적 파일(HTML/CSS/JS)과 API 응답 압축. Caddy 의 encode 를 대체한다.
server.compression.enabled=true
# .js 는 text/javascript 로 서빙된다(최신 표준). application/javascript 만 적으면 압축이 안 걸린다.
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
