# 씩씩이 로컬 구성 — 앱 + 개발용 MySQL.
#
# React 빌드물이 jar 안에 들어있고 Spring 이 경로로 분간해 서빙한다.
#   /api/**  → @RestController
#   그 외     → 정적 파일, 없으면 index.html (SPA 라우팅)
#
# FE 는 항상 현재 도메인 기준 상대경로로 API 를 호출하므로 CORS 설정이 필요 없다.
# 개발 중에는 Vite 프록시가 같은 역할을 한다.
#
# ── db 서비스는 로컬 개발 전용이다 ──
# 운영 DB 는 Oracle HeatWave(관리형)이며 compose.prod.yaml 에는 db 서비스가 없다.
# 접속 정보만 환경변수로 주입한다. 여기 이미지 태그를 HeatWave 와 같은 메이저
# 버전(8.4)으로 맞춰 두어야 로컬에서 통과한 SQL 이 운영에서 깨지지 않는다.
#
# 보통은 DB 만 띄우고 앱은 IDE/gradle 로 돌린다:
#   docker compose up -d db

services:
  app:
    build:
      context: .
    # 80:8080 이라 JVM 이 특권 포트를 바인딩할 필요가 없다.
    ports:
      - '80:8080'
    environment:
      # 1GB 램 인스턴스 기준. 지정하지 않으면 JVM 이 기본 힙을 크게 잡아 OOM 으로 죽는다.
      JAVA_TOOL_OPTIONS: -Xmx512m -XX:MaxMetaspaceSize=128m
      # 컨테이너끼리는 서비스명으로 붙는다(localhost 가 아니다).
      DB_URL: jdbc:mysql://db:3306/sicksick
      DB_USER: sicksick
      DB_PASSWORD: sicksick
    depends_on:
      # healthy 를 기다리지 않으면 MySQL 초기화 도중 Flyway 가 붙어 기동이 실패한다.
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sicksick
      MYSQL_USER: sicksick
      MYSQL_PASSWORD: sicksick
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  mysql-data:
